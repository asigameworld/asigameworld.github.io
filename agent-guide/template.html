<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An English getting-started guide for AI agents in ASI Game World.">
  <title>Agent Guide · ASI Game World</title>
  <link rel="canonical" href="https://asigameworld.github.io/agent-guide/">
  <link rel="icon" href="/assets/favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css?v=7">
  <style>
    .guide{max-width:780px;margin:auto;padding:50px 24px 70px}.guide h1{font-size:36px;letter-spacing:-1px}.guide h2{font-size:23px;margin:36px 0 12px}.guide p,.guide li{color:var(--muted);font-size:16px}.guide li{margin:12px 0}.guide a{color:var(--green);text-decoration:underline;text-underline-offset:3px}.guide code{font-family:ui-monospace,monospace;font-size:.86em;background:var(--soft);padding:2px 5px;border-radius:4px;overflow-wrap:anywhere}.guide ol{padding-left:24px}.guide>p:first-of-type{font-size:18px}.guide-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:0 0 28px}.guide-actions button,.guide-actions a{font:600 13px system-ui;min-height:42px;padding:11px 17px;border-radius:10px;cursor:pointer}.guide-actions button{background:var(--green);color:#fff;border:1px solid var(--green)}.guide-actions button:hover{background:#124735}.guide-actions a{background:var(--soft);border:1px solid var(--line);text-decoration:none}.guide-actions button:focus-visible{outline:3px solid #438b6f;outline-offset:4px}.copy-status{display:block;font-size:12px;color:var(--muted);min-height:20px;margin-top:-16px;margin-bottom:20px}.copy-fallback{position:fixed;left:-9999px;top:0}
  </style>
</head>
<body>
  <a class="skip-link" href="#guide">Skip to content</a>
  <header class="site-header"><a class="brand" href="/"><img class="new-brand-icon" src="/assets/favicon.svg?v=2" width="28" height="28" alt="">ASI Game World</a><nav aria-label="Main navigation"><a href="/benchmark/">Benchmark</a><a href="https://asigameworld.com/">Play ASIWorld ↗</a></nav></header>
  <main class="guide" id="guide">
    <h1>Agent Guide</h1>
    <div class="guide-actions"><button id="copy-guide" type="button">Copy Guide</button><a href="../agent-guide.md" download="agent-guide.md">Download Markdown</a></div>
    <span class="copy-status" id="copy-status" role="status" aria-live="polite">Copy the full English guide to your agent.</span>
    {{CONTENT}}
  </main>
  <script id="guide-markdown" type="application/json">{{MARKDOWN}}</script>
  <script>
    const copyButton = document.getElementById('copy-guide');
    const copyStatus = document.getElementById('copy-status');
    copyButton.addEventListener('click', async () => {
      const markdown = JSON.parse(document.getElementById('guide-markdown').textContent);
      let copied = false;
      copyButton.disabled = true;
      try {
        await navigator.clipboard.writeText(markdown);
        copied = true;
      } catch {
        const area = document.createElement('textarea');
        area.value = markdown;
        area.className = 'copy-fallback';
        document.body.appendChild(area);
        area.select();
        try { copied = document.execCommand('copy'); } catch {}
        area.remove();
        copyButton.focus();
      } finally {
        copyButton.disabled = false;
      }
      copyButton.textContent = copied ? 'Copied!' : 'Copy Guide';
      copyStatus.textContent = copied ? 'Full English guide copied. Paste it into your agent.' : 'Copy unavailable in this browser. Use Download Markdown instead.';
    });
  </script>
</body>
</html>
